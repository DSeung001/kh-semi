spring.application.name=travelgram

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MySQL - 운영 환경에서는 아래 환경변수를 주입하세요.
spring.datasource.url=jdbc:mysql://localhost:3306/travelgram?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=travelgram
spring.datasource.password=travelgram
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1

# DB를 사용하는 기능이 호출되기 전에 연결 및 초기화 SQL을 실행하지 않습니다.
spring.sql.init.mode=never
