spring.application.name=zzanmat-tour

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 파일 업로드 용량 제한 설정 (예: 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# MyBatis
# type-aliases: XML에서 FQCN 대신 클래스 단순명 사용 (예: MemberDto, PostDto)
mybatis.type-aliases-package=com.zzanmat.tour
# Mapper XML 위치: resources/mappers/{Domain}Mapper.xml
mybatis.mapper-locations=classpath:mappers/**/*.xml
# DB 컬럼 snake_case <-> Java 필드 camelCase 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

file.upload-dir=C:/zzan/uploads/
file.upload-dir.post=C:/zzan/uploads/post/

# 새로 추가한 파일 업로드 프로퍼티
file.upload-dir.profile=C:/zzan/uploads/profile/
file.upload-dir.chat=C:/zzan/uploads/chat/


# MySQL - 운영 환경에서는 아래 환경변수를 주입하세요.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ZAD?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zzanmat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zzanmat}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1

# DB를 사용하는 기능이 호출되기 전에 연결 및 초기화 SQL을 실행하지 않습니다.
spring.sql.init.mode=never

# UTF-8 인코딩 강제
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8

server.error.whitelabel.enabled=false

#메일기능 로컬
app.mail.mode=local

# 네이버 SMTP 설정
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:user01@naver.com}
spring.mail.password=${MAIL_PASSWORD:G511FP01U}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com
spring.mail.properties.mail.smtp.starttls.enable=false

# 카카오 소셜 로그인 설정
spring.security.oauth2.client.registration.kakao.client-id=${REST_API_KEY:sdakhdaskasd22sadjksD}
spring.security.oauth2.client.registration.kakao.client-secret=${CLIENT_SECRET_KEY:DNAKDNkjksadfksanf643}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-name=Kakao
