spring.application.name=zzanmat-tour

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 파일 업로드 용량 제한 설정 (예: 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#mybatis 설정
mybatis.type-aliases-package=com.zzanmat.tour.member
mybatis.mapper-locations=classpath:mappers/**/*.xml
# 컬럼명(snake_case) <-> 자바 필드명(camelCase) 자동매핑
mybatis.configuration.map-underscore-to-camel-case=true


# MySQL - 운영 환경에서는 아래 환경변수를 주입하세요.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zad?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zzanmat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zzanmat}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1

# DB를 사용하는 기능이 호출되기 전에 연결 및 초기화 SQL을 실행하지 않습니다.
spring.sql.init.mode=never

server.error.whitelabel.enabled=false
