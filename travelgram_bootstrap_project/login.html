<html lang="ko">
<head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  
</head>
<body>
<div class="tg-app">
  
<header class="tg-mobile-header">
  <a class="tg-brand" href="index.html">
    <span class="tg-brand-mark"><i class="bi bi-camera"></i></span>
    <span>travelgram</span>
  </a>
  <a href="login.html" class="fs-5" aria-label="로그인">
    <i class="bi bi-box-arrow-in-right"></i>
  </a>
</header>

<nav class="tg-mobile-nav" aria-label="모바일 메뉴">
  <a href="index.html" data-nav-key="home" aria-label="홈"><i class="bi bi-house"></i></a>
  <a href="travelgram.html" data-nav-key="travelgram" aria-label="나만의 여행실"><i class="bi bi-grid-3x3-gap"></i></a>
  <a href="new-post.html" data-nav-key="new" aria-label="게시물 만들기"><i class="bi bi-plus-square"></i></a>
  <a href="chat.html" data-nav-key="chat" aria-label="실시간 톡"><i class="bi bi-chat-dots"></i></a>
  <a href="profile.html" data-nav-key="profile" aria-label="내 정보"><i class="bi bi-person-circle"></i></a>
</nav>

  <div class="tg-layout">
    
<aside class="tg-sidebar">
  <a class="tg-brand" href="index.html">
    <span class="tg-brand-mark"><i class="bi bi-camera"></i></span>
    <span>travelgram</span>
  </a>

  <nav class="tg-nav" aria-label="주요 메뉴">
    <a class="tg-nav-link" href="index.html" data-nav-key="home">
      <i class="bi bi-house"></i>
      <span>홈</span>
    </a>

    <a class="tg-nav-link" href="travelgram.html" data-nav-key="travelgram">
      <i class="bi bi-grid-3x3-gap"></i>
      <span>나만의 여행실</span>
    </a>

    <a class="tg-nav-link" href="chat.html" data-nav-key="chat">
      <i class="bi bi-chat-dots"></i>
      <span>실시간 톡</span>
    </a>

    <a class="tg-nav-link" href="tag.html" data-nav-key="tag">
      <i class="bi bi-hash"></i>
      <span>태그</span>
    </a>

    <a class="tg-nav-link" href="mission.html" data-nav-key="mission">
      <i class="bi bi-flag"></i>
      <span>Mission Possible</span>
    </a>

    <a class="tg-nav-link" href="profile.html" data-nav-key="profile">
      <i class="bi bi-person-circle"></i>
      <span>내 정보</span>
    </a>

    <a class="tg-nav-link" href="new-post.html" data-nav-key="new">
      <i class="bi bi-plus-square"></i>
      <span>게시물 만들기</span>
    </a>
  </nav>

  <div class="tg-sidebar-footer">
    <a href="#">이용약관</a><br>
    <a href="#">개인정보처리방침</a><br>
    <span>© 2026 Travelgram</span>
  </div>
</aside>

    <main class="tg-content">
      
<div class="tg-auth-wrap">
  <section class="tg-panel tg-auth-card tg-panel-shadow">
    <h1 class="tg-auth-title">login</h1>
    <form data-demo-form data-message="로그인 데모입니다." data-redirect="index.html">
      <div class="form-floating mb-3">
        <input id="login-id" class="form-control" type="text" placeholder="아이디" required>
        <label for="login-id">아이디</label>
      </div>
      <div class="form-floating mb-3">
        <input id="login-password" class="form-control" type="password" placeholder="비밀번호" required>
        <label for="login-password">비밀번호</label>
      </div>

      <div class="d-flex flex-wrap gap-3 mb-3">
        <div class="form-check">
          <input id="save-id" class="form-check-input" type="checkbox">
          <label class="form-check-label small" for="save-id">아이디 저장</label>
        </div>
        <div class="form-check">
          <input id="auto-login" class="form-check-input" type="checkbox">
          <label class="form-check-label small" for="auto-login">자동 로그인</label>
        </div>
      </div>

      <button class="btn btn-primary tg-primary-btn w-100 py-2" type="submit">로그인</button>
    </form>

    <div class="d-flex justify-content-center flex-wrap gap-2 my-3 small">
      <a href="forgot-password.html">아이디 찾기</a>
      <span class="tg-muted">/</span>
      <a href="forgot-password.html">비밀번호 찾기</a>
      <span class="tg-muted">/</span>
      <a href="signup.html">회원가입</a>
    </div>

    <div class="tg-divider">또는</div>

    <button class="btn tg-social-kakao w-100 py-2 mb-3" type="button">
      <i class="bi bi-chat-fill me-2"></i>카카오 로그인
    </button>
    <button class="btn tg-social-naver w-100 py-2" type="button">
      <strong class="me-2">N</strong>네이버 로그인
    </button>
  </section>
</div>

    </main>
    
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/common.js"></script>

</body>
</html>
